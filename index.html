<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex Rush - Cyber Neon Speed Trainer</title>
    <!-- Font Inter & Orbitron untuk Nuansa Cyberpunk/Arcade -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0a0a12',
                            card: '#121225',
                            neonPink: '#ff007f',
                            neonBlue: '#00f0ff',
                            neonPurple: '#7000ff',
                            neonYellow: '#ffea00',
                            neonGreen: '#00ff66'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Styling & Neon Glow Effects */
        body {
            background-color: #05050a;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 40%);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .neon-box-blue {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.2);
            border: 1px solid rgba(0, 240, 255, 0.5);
        }

        .neon-box-pink {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3), inset 0 0 10px rgba(255, 0, 127, 0.2);
            border: 1px solid rgba(255, 0, 127, 0.5);
        }

        .neon-text-blue {
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .neon-text-pink {
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.8), 0 0 20px rgba(255, 0, 127, 0.4);
        }

        .neon-text-yellow {
            text-shadow: 0 0 8px rgba(255, 234, 0, 0.8), 0 0 20px rgba(255, 234, 0, 0.4);
        }

        /* Target Active State Animation */
        .target-node {
            transition: all 0.15s ease-out;
        }

        .target-node.active {
            background: radial-gradient(circle, #ff007f 20%, #7000ff 80%);
            box-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f, inset 0 0 10px #ffffff;
            border-color: #ffffff;
            transform: scale(0.96);
        }

        .target-node.gold-active {
            background: radial-gradient(circle, #ffea00 20%, #ff6c00 80%);
            box-shadow: 0 0 25px #ffea00, 0 0 50px #ffea00, inset 0 0 10px #ffffff;
            border-color: #ffffff;
            transform: scale(0.96);
        }

        /* Hit & Miss Ripple Effects */
        @keyframes popHit {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .hit-effect {
            animation: popHit 0.2s ease-out;
        }

        @keyframes missShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .shake {
            animation: missShake 0.25s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Grid Canvas Particle Overlay */
        #particleCanvas {
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
        }
    </style>
</head>
<body class="font-rajdhani text-white min-h-screen flex flex-col justify-between items-center p-3 md:p-6 overflow-x-hidden">

    <!-- Particle Overlay Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Header & Title -->
    <header class="text-center w-full max-w-lg mb-2 relative z-10">
        <h1 class="font-orbitron text-3xl sm:text-4xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyber-neonBlue via-cyber-neonPink to-cyber-neonYellow neon-text-blue">
            REFLEX RUSH
        </h1>
        <p class="text-xs sm:text-sm text-gray-400 font-semibold tracking-widest uppercase mt-1">
            Cybernetic Speed & Accuracy Trainer
        </p>
    </header>

    <!-- Main Game Wrapper -->
    <main class="w-full max-w-lg flex flex-col items-center gap-3 relative z-10 my-auto">
        
        <!-- Scoreboard & Dashboard -->
        <div class="w-full grid grid-cols-3 gap-2 sm:gap-3 text-center">
            <!-- Score Card -->
            <div class="bg-cyber-card p-2 sm:p-3 rounded-xl neon-box-blue flex flex-col justify-center">
                <span class="text-xs text-gray-400 font-orbitron uppercase">SKOR</span>
                <span id="scoreText" class="text-2xl sm:text-3xl font-orbitron font-extrabold text-cyber-neonBlue neon-text-blue">0</span>
            </div>
            
            <!-- Timer Card -->
            <div class="bg-cyber-card p-2 sm:p-3 rounded-xl neon-box-pink flex flex-col justify-center">
                <span class="text-xs text-gray-400 font-orbitron uppercase">WAKTU</span>
                <span id="timerText" class="text-2xl sm:text-3xl font-orbitron font-extrabold text-cyber-neonPink neon-text-pink">30s</span>
            </div>

            <!-- Combo Multiplier Card -->
            <div class="bg-cyber-card p-2 sm:p-3 rounded-xl neon-box-blue flex flex-col justify-center relative overflow-hidden">
                <span class="text-xs text-gray-400 font-orbitron uppercase">COMBO</span>
                <span id="comboText" class="text-2xl sm:text-3xl font-orbitron font-extrabold text-cyber-neonYellow neon-text-yellow">x1</span>
                <!-- Combo Progress Bar -->
                <div class="absolute bottom-0 left-0 h-1 bg-cyber-neonYellow transition-all duration-200" id="comboBar" style="width: 0%"></div>
            </div>
        </div>

        <!-- High Score & Difficulty Bar -->
        <div class="w-full flex justify-between items-center px-2 text-xs sm:text-sm font-orbitron text-gray-300">
            <div>
                HIGHSCORE: <span id="highScoreText" class="text-cyber-neonGreen font-bold">0</span>
            </div>
            <!-- Difficulty Selector Buttons -->
            <div class="flex gap-1 bg-cyber-card p-1 rounded-lg border border-gray-800">
                <button id="btnEasy" onclick="setDifficulty('easy')" class="px-2 py-1 rounded text-xs transition duration-200 bg-cyber-neonPurple font-bold">EASY</button>
                <button id="btnMedium" onclick="setDifficulty('medium')" class="px-2 py-1 rounded text-xs transition duration-200 text-gray-400 hover:text-white">MED</button>
                <button id="btnHard" onclick="setDifficulty('hard')" class="px-2 py-1 rounded text-xs transition duration-200 text-gray-400 hover:text-white">HARD</button>
            </div>
        </div>

        <!-- 4x4 Arena Grid -->
        <div id="gridContainer" class="relative w-full aspect-square bg-cyber-card/80 backdrop-blur-md p-3 sm:p-4 rounded-2xl border border-cyber-neonPurple/40 shadow-2xl grid grid-cols-4 grid-rows-4 gap-2 sm:gap-3">
            
            <!-- Overlay Start Screen over Grid -->
            <div id="startOverlay" class="absolute inset-0 bg-cyber-bg/90 backdrop-blur-md rounded-2xl z-30 flex flex-col justify-center items-center p-6 text-center">
                <div class="w-16 h-16 mb-4 rounded-full bg-cyber-neonPink/20 flex items-center justify-center border border-cyber-neonPink animate-pulse">
                    <svg class="w-8 h-8 text-cyber-neonPink" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <h2 class="font-orbitron text-2xl font-bold mb-2 text-white">SIAP UJI REFLEKS?</h2>
                <p class="text-sm text-gray-300 mb-6 max-w-xs">Ketuk node yang menyala secepat mungkin. Jaga kombinasi untuk poin berlipat!</p>
                <button id="startBtn" onclick="startGame()" class="w-full max-w-xs py-3 px-6 rounded-xl font-orbitron font-extrabold text-lg text-black bg-gradient-to-r from-cyber-neonBlue via-cyber-neonGreen to-cyber-neonYellow hover:brightness-110 active:scale-95 transition-all duration-150 shadow-lg shadow-cyber-neonBlue/40">
                    MULAI PERMAINAN
                </button>
            </div>

            <!-- 16 Nodes generated via JS -->
        </div>

    </main>

    <!-- Footer Controls -->
    <footer class="w-full max-w-lg mt-2 flex justify-between items-center text-xs text-gray-500 font-orbitron z-10">
        <span>SOUND: <button id="soundToggle" onclick="toggleSound()" class="text-cyber-neonBlue underline font-bold">ON</button></span>
        <span>REFLEX TRAINER v1.0</span>
    </footer>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="fixed inset-0 bg-black/80 backdrop-blur-lg z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-cyber-card border border-cyber-neonPink/50 p-6 sm:p-8 rounded-2xl max-w-md w-full text-center relative shadow-2xl neon-box-pink">
            
            <h2 class="font-orbitron text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyber-neonPink to-cyber-neonYellow mb-1">
                GAME OVER
            </h2>
            <p id="evaluationText" class="text-xs text-cyber-neonBlue font-orbitron tracking-widest uppercase mb-6">LUAR BIASA!</p>

            <!-- Stats Summary Table -->
            <div class="grid grid-cols-2 gap-3 mb-6 text-left">
                <div class="bg-black/40 p-3 rounded-lg border border-gray-800">
                    <span class="text-xs text-gray-400 block font-orbitron">TOTAL SKOR</span>
                    <span id="finalScore" class="text-2xl font-extrabold text-cyber-neonBlue font-orbitron">0</span>
                </div>
                <div class="bg-black/40 p-3 rounded-lg border border-gray-800">
                    <span class="text-xs text-gray-400 block font-orbitron">AKURASI</span>
                    <span id="finalAccuracy" class="text-2xl font-extrabold text-cyber-neonGreen font-orbitron">0%</span>
                </div>
                <div class="bg-black/40 p-3 rounded-lg border border-gray-800">
                    <span class="text-xs text-gray-400 block font-orbitron">MAX COMBO</span>
                    <span id="finalMaxCombo" class="text-2xl font-extrabold text-cyber-neonYellow font-orbitron">x0</span>
                </div>
                <div class="bg-black/40 p-3 rounded-lg border border-gray-800">
                    <span class="text-xs text-gray-400 block font-orbitron">TOTAL HITS/MISS</span>
                    <span id="finalHitsMiss" class="text-lg font-bold text-gray-200 font-orbitron">0 / 0</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-3">
                <button onclick="restartGame()" class="flex-1 py-3 rounded-xl font-orbitron font-bold text-black bg-gradient-to-r from-cyber-neonBlue to-cyber-neonGreen hover:brightness-110 active:scale-95 transition">
                    MAIN LAGI
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        /* ==========================================
           1. AUDIO SYNTHESIZER (Web Audio API)
           ========================================== */
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playHit(isGold = false) {
                if (!this.enabled) return;
                this.init();

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = isGold ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(isGold ? 880 : 587.33, this.ctx.currentTime); // A5 or D5
                osc.frequency.exponentialRampToValueAtTime(isGold ? 1760 : 1174.66, this.ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playMiss() {
                if (!this.enabled) return;
                this.init();

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.15);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playGameOver() {
                if (!this.enabled) return;
                this.init();

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'square';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.4);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        }

        const soundFX = new SoundFX();

        function toggleSound() {
            soundFX.enabled = !soundFX.enabled;
            document.getElementById('soundToggle').innerText = soundFX.enabled ? 'ON' : 'OFF';
            document.getElementById('soundToggle').className = soundFX.enabled ? 'text-cyber-neonBlue underline font-bold' : 'text-gray-500 underline font-bold';
        }

        /* ==========================================
           2. CANVAS PARTICLE SYSTEM
           ========================================== */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 4 + 2;
                this.velocity = {
                    x: (Math.random() - 0.5) * 8,
                    y: (Math.random() - 0.5) * 8
                };
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.015;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
            }
        }

        function createParticles(x, y, color = '#00f0ff', count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                if (p.alpha > 0) {
                    p.update();
                    p.draw();
                } else {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* ==========================================
           3. GAME ENGINE & STATE MANAGEMENT
           ========================================== */
        const GRID_SIZE = 16;
        const GAME_DURATION = 30; // Seconds

        let score = 0;
        let timeLeft = GAME_DURATION;
        let combo = 0;
        let maxCombo = 0;
        let totalHits = 0;
        let totalClicks = 0;
        let activeNodeIndex = -1;
        let isGoldTarget = false;
        
        let gameTimer = null;
        let targetSpawnTimer = null;
        let targetExpireTimer = null;
        let isPlaying = false;
        let highScore = parseInt(localStorage.getItem('reflex_high_score')) || 0;

        // Difficulty Configs (Spawn Interval & Target Lifetime)
        const difficultySettings = {
            easy: { spawnTime: 900, duration: 1200 },
            medium: { spawnTime: 650, duration: 850 },
            hard: { spawnTime: 450, duration: 600 }
        };
        let currentDifficulty = 'easy';

        // DOM Elements
        const gridContainer = document.getElementById('gridContainer');
        const scoreText = document.getElementById('scoreText');
        const timerText = document.getElementById('timerText');
        const comboText = document.getElementById('comboText');
        const comboBar = document.getElementById('comboBar');
        const highScoreText = document.getElementById('highScoreText');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverModal = document.getElementById('gameOverModal');

        // Render Highscore Initial
        highScoreText.innerText = highScore;

        // Generate 4x4 Grid Nodes
        function initGrid() {
            // Remove existing nodes except start overlay
            const nodes = gridContainer.querySelectorAll('.target-node');
            nodes.forEach(n => n.remove());

            for (let i = 0; i < GRID_SIZE; i++) {
                const node = document.createElement('button');
                node.className = 'target-node bg-cyber-bg/60 border border-gray-800 rounded-2xl flex items-center justify-center cursor-pointer relative overflow-hidden active:scale-90';
                node.dataset.index = i;
                
                // Add click / touch handler
                node.addEventListener('mousedown', (e) => handleNodeClick(e, i));
                node.addEventListener('touchstart', (e) => {
                    e.preventDefault(); // Prevent double trigger on mobile
                    handleNodeClick(e, i);
                });

                gridContainer.appendChild(node);
            }
        }
        initGrid();

        // Set Game Difficulty
        function setDifficulty(level) {
            if (isPlaying) return;
            currentDifficulty = level;

            ['btnEasy', 'btnMedium', 'btnHard'].forEach(id => {
                const btn = document.getElementById(id);
                btn.className = "px-2 py-1 rounded text-xs transition duration-200 text-gray-400 hover:text-white";
            });

            const activeBtn = document.getElementById('btn' + level.charAt(0).toUpperCase() + level.slice(1));
            activeBtn.className = "px-2 py-1 rounded text-xs transition duration-200 bg-cyber-neonPurple font-bold text-white";
        }

        // Start Game Session
        function startGame() {
            soundFX.init();
            isPlaying = true;
            score = 0;
            timeLeft = GAME_DURATION;
            combo = 0;
            maxCombo = 0;
            totalHits = 0;
            totalClicks = 0;
            activeNodeIndex = -1;

            updateUI();
            startOverlay.classList.add('hidden');
            gameOverModal.classList.add('hidden');
            gameOverModal.classList.remove('opacity-100');

            // Countdown Timer
            gameTimer = setInterval(() => {
                timeLeft--;
                timerText.innerText = `${timeLeft}s`;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Spawn First Target
            spawnTarget();
        }

        // Spawn Target Logic
        function spawnTarget() {
            if (!isPlaying) return;

            clearActiveTarget();

            // Select Random Node Different From Previous
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * GRID_SIZE);
            } while (newIndex === activeNodeIndex);

            activeNodeIndex = newIndex;
            isGoldTarget = Math.random() < 0.2; // 20% Chance for Golden Target (Bonus Poin)

            const nodes = gridContainer.querySelectorAll('.target-node');
            const targetNode = nodes[activeNodeIndex];

            if (targetNode) {
                targetNode.classList.add(isGoldTarget ? 'gold-active' : 'active');

                // Schedule Expiry if Not Clicked
                const config = difficultySettings[currentDifficulty];
                targetExpireTimer = setTimeout(() => {
                    if (isPlaying && activeNodeIndex === newIndex) {
                        // Missed Target due to timeout
                        resetCombo();
                        clearActiveTarget();
                        scheduleNextSpawn();
                    }
                }, config.duration);
            }
        }

        function scheduleNextSpawn() {
            if (!isPlaying) return;
            const config = difficultySettings[currentDifficulty];
            targetSpawnTimer = setTimeout(spawnTarget, config.spawnTime * 0.3); // Short delay between spawns
        }

        function clearActiveTarget() {
            if (activeNodeIndex !== -1) {
                const nodes = gridContainer.querySelectorAll('.target-node');
                if (nodes[activeNodeIndex]) {
                    nodes[activeNodeIndex].classList.remove('active', 'gold-active');
                }
            }
            clearTimeout(targetExpireTimer);
        }

        // Handle Click / Tap on Nodes
        function handleNodeClick(e, index) {
            if (!isPlaying) return;

            totalClicks++;
            const targetNode = e.currentTarget;
            const rect = targetNode.getBoundingClientRect();
            const clickX = e.clientX || (e.touches && e.touches[0].clientX) || (rect.left + rect.width / 2);
            const clickY = e.clientY || (e.touches && e.touches[0].clientY) || (rect.top + rect.height / 2);

            if (index === activeNodeIndex) {
                // SUCCESS HIT!
                totalHits++;
                combo++;
                if (combo > maxCombo) maxCombo = combo;

                // Points Formula: (Base + Bonus) * Combo Multiplier
                const basePoints = isGoldTarget ? 300 : 100;
                const pointsEarned = basePoints * (1 + Math.floor(combo / 5) * 0.5);
                score += Math.round(pointsEarned);

                // Sound & FX
                soundFX.playHit(isGoldTarget);
                createParticles(clickX, clickY, isGoldTarget ? '#ffea00' : '#ff007f', isGoldTarget ? 20 : 12);
                
                targetNode.classList.add('hit-effect');
                setTimeout(() => targetNode.classList.remove('hit-effect'), 200);

                clearActiveTarget();
                scheduleNextSpawn();
            } else {
                // MISS / WRONG NODE!
                resetCombo();
                soundFX.playMiss();
                gridContainer.classList.add('shake');
                setTimeout(() => gridContainer.classList.remove('shake'), 250);
            }

            updateUI();
        }

        function resetCombo() {
            combo = 0;
            updateUI();
        }

        // Update Dashboard Text & Visuals
        function updateUI() {
            scoreText.innerText = score.toLocaleString();
            comboText.innerText = `x${Math.max(1, Math.floor(combo / 5) + 1)}`;
            
            // Update Combo Progress Bar (Fills up to 5 for next multiplier)
            const progress = (combo % 5) * 20;
            comboBar.style.width = `${progress}%`;
        }

        // End Game Session
        function endGame() {
            isPlaying = false;
            clearInterval(gameTimer);
            clearTimeout(targetSpawnTimer);
            clearTimeout(targetExpireTimer);
            clearActiveTarget();

            soundFX.playGameOver();

            // Save High Score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('reflex_high_score', highScore);
                highScoreText.innerText = highScore;
            }

            // Calculate Accuracy
            const accuracy = totalClicks > 0 ? Math.round((totalHits / totalClicks) * 100) : 0;

            // Fill Game Over Modal
            document.getElementById('finalScore').innerText = score.toLocaleString();
            document.getElementById('finalAccuracy').innerText = `${accuracy}%`;
            document.getElementById('finalMaxCombo').innerText = `x${maxCombo}`;
            document.getElementById('finalHitsMiss').innerText = `${totalHits} / ${totalClicks - totalHits}`;

            // Performance Evaluation Title
            const evalText = document.getElementById('evaluationText');
            if (accuracy >= 90 && score > 3000) evalText.innerText = "REFLEKS LEVEL CYBORG! ⚡";
            else if (accuracy >= 75) evalText.innerText = "CEPAT & PRESISI! 🚀";
            else if (accuracy >= 50) evalText.innerText = "LATIHAN LAGI BISA LEBIH BAGUS! 👍";
            else evalText.innerText = "FOKUSKAN PANDANGANMU! 🎯";

            // Show Modal with Smooth Fade-in
            gameOverModal.classList.remove('hidden');
            setTimeout(() => {
                gameOverModal.classList.add('opacity-100');
            }, 50);
        }

        function restartGame() {
            startGame();
        }
    </script>
</body>
</html>
